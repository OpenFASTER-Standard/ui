name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openfaster-standard/ui lint
      - run: pnpm --filter @openfaster-standard/ui exec tsc --noEmit
      - run: pnpm --filter @openfaster-standard/ui build
      - run: pnpm --filter @openfaster-standard/ui test
      - run: pnpm --filter @openfaster-standard/ui build-storybook
      # @openfaster-standard/shapes depends on @openfaster-standard/ui's
      # built dist/ (a workspace link, not source) -- these steps run
      # after the ui build above, not before, deliberately.
      - run: pnpm --filter @openfaster-standard/shapes lint
      - run: pnpm --filter @openfaster-standard/shapes exec tsc --noEmit
      - run: pnpm --filter @openfaster-standard/shapes build
      - run: pnpm --filter @openfaster-standard/shapes test
      # @openfaster-standard/write-client depends on @openfaster-standard/shapes'
      # built dist/ -- these steps run after the shapes build above.
      - run: pnpm --filter @openfaster-standard/write-client lint
      - run: pnpm --filter @openfaster-standard/write-client exec tsc --noEmit
      - run: pnpm --filter @openfaster-standard/write-client build
      - run: pnpm --filter @openfaster-standard/write-client test
