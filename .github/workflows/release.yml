name: Release

on:
  # Gated on CI's own success, not a plain push -- `push: branches: [main]`
  # on both workflows would fire this independently and concurrently with
  # ci.yml, with no ordering guarantee that CI finishes (or even that it
  # passes) before this one starts publishing. workflow_run only fires
  # after CI has actually concluded, and its conclusion is checked below.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run's default checkout is the branch tip at trigger
          # time, not necessarily the exact commit CI just tested -- if
          # another push landed on main in between, that would publish an
          # untested commit. Pin explicitly to the commit CI actually ran
          # against (a no-op for workflow_dispatch, where this context is
          # empty and checkout already defaults to the triggering ref).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openfaster-standard/ui exec tsc --noEmit
      - run: pnpm --filter @openfaster-standard/ui build
      - run: pnpm --filter @openfaster-standard/ui test
      # @openfaster-standard/shapes depends on @openfaster-standard/ui's
      # built dist/ (a workspace link, not source) -- these steps run
      # after the ui build above, not before, deliberately.
      - run: pnpm --filter @openfaster-standard/shapes exec tsc --noEmit
      - run: pnpm --filter @openfaster-standard/shapes build
      - run: pnpm --filter @openfaster-standard/shapes test
      # @openfaster-standard/write-client depends on @openfaster-standard/shapes'
      # built dist/ -- these steps run after the shapes build above.
      - run: pnpm --filter @openfaster-standard/write-client exec tsc --noEmit
      - run: pnpm --filter @openfaster-standard/write-client build
      - run: pnpm --filter @openfaster-standard/write-client test
      - uses: changesets/action@v1
        with:
          # `-r publish` walks every workspace package with a version bump
          # pending from this run's `changeset version` step -- pinning to
          # just `--filter @openfaster-standard/ui` here silently excluded
          # every other package (first case: @openfaster-standard/shapes)
          # from ever actually being published, despite changesets tracking
          # and version-bumping it like any other releasable package.
          publish: pnpm -r publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
